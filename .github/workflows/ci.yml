name: CI
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, macos-latest], python: ["3.11", "3.12", "3.13"] }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with: { python-version: "${{ matrix.python }}", enable-cache: true }
      # Every extra and the dev dependency group (installed by default).
      - run: uv sync --all-extras --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      # Default suite only: pyproject's addopts deselect the render marker (Node + Remotion).
      - run: uv run pytest --cov --cov-fail-under=90
  library:
    # The asset library's Node side (design §11): types, props schemas, the authoring rules.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - if: hashFiles('library/package.json') != ''
        uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: library/package-lock.json }
      - if: hashFiles('library/package.json') != ''
        run: npm ci && npm run check
        working-directory: library
  build:
    runs-on: ubuntu-latest
    needs: [test, library]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv build
      - name: Smoke test the wheel in a clean env
        run: |
          uv venv "$RUNNER_TEMP/smoke"
          # honeworks siblings not on PyPI yet come from their git sources first (hone-motif depends on none today)
          mapfile -t SIBLINGS < <(python3 scripts/git-sources.py)
          if [ "${#SIBLINGS[@]}" -gt 0 ]; then uv pip install --python "$RUNNER_TEMP/smoke/bin/python" "${SIBLINGS[@]}"; fi
          uv pip install --python "$RUNNER_TEMP/smoke/bin/python" dist/*.whl
          "$RUNNER_TEMP/smoke/bin/python" -c "import hone_motif; print(hone_motif.__version__)"
          if [ -f examples/quickstart.py ]; then   # the README quickstart, with only the wheel installed
            cd "$RUNNER_TEMP" && "$RUNNER_TEMP/smoke/bin/python" "$GITHUB_WORKSPACE/examples/quickstart.py"
          fi
      - uses: actions/upload-artifact@v7
        with: { name: dist, path: dist/ }
