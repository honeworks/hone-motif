[project]
name = "hone-motif"
dynamic = ["version"]
description = "The engine for libraries of code-built video assets (intros, overlays, end screens, transitions, captions): categorised, themed and searchable, placed by AI in one whole-video call, checked against typed props and rendered once into a cache."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Bahman Shadmehr", email = "info@bshadmehr.me" }]
keywords = ["ai", "video", "motion-graphics", "remotion", "overlays", "transitions", "youtube", "honeworks"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
# jsonschema validates props against each asset's exported JSON Schema (design/decisions.md D-001). The
# command line needs nothing more (argparse, D-017). Rendering needs Node and Remotion, never a Python
# dependency (design §8).
dependencies = [
    "jsonschema>=4.21",
    "pydantic>=2.7",
]

[dependency-groups]
# Development tools (PEP 735): installed by `uv sync`, never published as an extra.
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-timeout>=2.3",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "types-jsonschema>=4.26.0.20261006",
]

[project.scripts]
hone-motif = "hone_motif.cli:run"

[project.urls]
Homepage = "https://github.com/honeworks/hone-motif"
Repository = "https://github.com/honeworks/hone-motif"
Issues = "https://github.com/honeworks/hone-motif/issues"
Changelog = "https://github.com/honeworks/hone-motif/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/hone_motif/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/hone_motif"]

# The asset library ships inside the package as hone_motif/library (decision D-014), without Node's files.
[tool.hatch.build.targets.wheel.force-include]
"library/vocabulary.json" = "hone_motif/library/vocabulary.json"
"library/aliases.json" = "hone_motif/library/aliases.json"
"library/themes.json" = "hone_motif/library/themes.json"
"library/sample-brand.json" = "hone_motif/library/sample-brand.json"
"library/asset.schema.json" = "hone_motif/library/asset.schema.json"
"library/package.json" = "hone_motif/library/package.json"
"library/package-lock.json" = "hone_motif/library/package-lock.json"
"library/tsconfig.json" = "hone_motif/library/tsconfig.json"
"library/assets" = "hone_motif/library/assets"
"library/fonts" = "hone_motif/library/fonts"
"library/shared" = "hone_motif/library/shared"
"library/src" = "hone_motif/library/src"
"library/scripts" = "hone_motif/library/scripts"

[tool.hatch.build.targets.sdist]
include = [
    "src/", "tests/", "docs/", "examples/", "design/", "library/", "README.md", "CONTRIBUTING.md", "AGENTS.md",
    "LICENSE", "CHANGELOG.md", "pyproject.toml",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["design"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "N", "S", "C4", "DTZ", "PL", "C90"]
# RUF012: pydantic copies mutable field defaults per instance, so `items: list[X] = []` is safe in models.
ignore = ["PLR0913", "PLR2004", "RUF012"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]  # tests run our own interpreter, git and ffmpeg

[tool.pyright]
include = ["src", "tests"]
strict = ["src"]
pythonVersion = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not render'"
timeout = 120
markers = [
    "e2e: acceptance-case tests (run by default)",
    "render: renders with Node and Remotion; run via scripts/gpu-lock.sh (design/decisions.md D-008)",
    "slow: slower than 5 s",
]

[tool.coverage.run]
branch = true
source = ["src/hone_motif"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload", "\\.\\.\\."]
