<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>hone-motif gallery</title>
<style>
:root{--bg:#0e0d0c;--card:#181614;--line:#2c2823;--text:#efe7d8;--mute:#a49a89;--accent:#d2b06a;
  --overlay:#7fb0c8;--scene:#d2b06a;--transition:#d57a5a;--caption:#9fc98a;--background:#b49ad8;--loop:#c8a0a0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{max-width:1560px;margin:auto;padding:26px 20px 6px}
h1{font:600 26px/1.2 Georgia,serif;margin:0 0 4px;color:var(--accent)}
header p{margin:2px 0;color:var(--mute);max-width:980px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 4px;align-items:center}
.filters select,.filters input{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit}
.filters input{min-width:220px}
.count{color:var(--mute);font-size:13px;margin-left:auto}
main{max-width:1560px;margin:auto;padding:12px 20px 48px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer}
.tile:hover{border-color:#5d4e36}
.media{position:relative;aspect-ratio:16/9;background:repeating-conic-gradient(#333 0 25%,#262626 0 50%) 0 0/20px 20px}
.media img,.media video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.media video{display:none;background:repeating-conic-gradient(#333 0 25%,#262626 0 50%) 0 0/20px 20px}
.media .none{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);font-size:13px;text-align:center;padding:12px}
.meta{padding:9px 12px 12px}
.row{display:flex;gap:8px;align-items:baseline}
.name{font-weight:600}
.kind{margin-left:auto;font-size:11px;text-transform:uppercase;letter-spacing:1.4px;border:1px solid;border-radius:99px;padding:0 7px}
.sub{color:var(--mute);font-size:12.5px}
.theme{font:12px ui-monospace,monospace;color:var(--accent)}
dialog{background:#12100e;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:0;width:min(1200px,96vw);max-height:94vh}
dialog::backdrop{background:rgba(0,0,0,.78)}
.dlg{padding:16px 20px 22px;overflow:auto;max-height:94vh}
.dlg video{width:100%;max-height:70vh;display:block;border-radius:8px;background:repeating-conic-gradient(#333 0 25%,#262626 0 50%) 0 0/24px 24px}
.close{float:right;background:none;border:0;color:var(--mute);font-size:26px;cursor:pointer}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{border-bottom:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}
th{color:var(--mute);font-weight:500;white-space:nowrap}
pre{background:#0b0a09;border:1px solid var(--line);border-radius:8px;padding:10px;font:12px/1.45 ui-monospace,monospace;overflow:auto;max-height:340px;white-space:pre-wrap}
.themes button{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:4px 10px;margin:0 6px 6px 0;cursor:pointer;font:inherit;font-size:13px}
.themes button.on{border-color:var(--accent);color:var(--accent)}
@media(max-width:820px){.two{grid-template-columns:1fr}main{padding:10px 16px}header{padding:20px 16px 4px}}
</style>
</head>
<body>
<header>
  <h1>hone-motif gallery</h1>
  <p>Every asset of the library in every theme it supports, rendered once into the local cache. Hover a tile to play it
    (transparent areas show as a checkerboard; a transition shows its effect layer); click it for the placement rules,
    text limits, props and licence.</p>
  <div class="filters" id="filters"></div>
</header>
<main id="grid"></main>
<dialog id="dlg"><div class="dlg" id="body"></div></dialog>
<script>
const DATA = /*GALLERY_DATA*/null;
const FILTERS = [["category", "Category"], ["kind", "Kind"], ["theme", "Theme"], ["mood", "Mood"], ["aspect", "Aspect"], ["script", "Script"]];
const state = {text: "", aspect: "16:9"};  // one look per theme by default; other aspects through the filter
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const values = {
  category: Object.keys(DATA.vocabulary.categories), kind: DATA.vocabulary.kinds, theme: DATA.vocabulary.themes,
  mood: DATA.vocabulary.moods.filter((m) => m !== "any"), aspect: DATA.vocabulary.aspects, script: DATA.vocabulary.scripts,
};
const bar = document.getElementById("filters");
for (const [key, label] of FILTERS) {
  const sel = document.createElement("select");
  sel.innerHTML = `<option value="">${label}: all</option>` + values[key].map((v) => `<option>${esc(v)}</option>`).join("");
  sel.value = state[key] || "";
  sel.onchange = () => { state[key] = sel.value; draw(); };
  bar.appendChild(sel);
}
const search = document.createElement("input");
search.placeholder = "Search names, lines, tags";
search.oninput = () => { state.text = search.value.toLowerCase(); draw(); };
bar.appendChild(search);
const count = document.createElement("span");
count.className = "count";
bar.appendChild(count);

const matches = (tile) => {
  const a = DATA.assets[tile.asset];
  const hay = [a.id, a.name, a.line, ...a.tags].join(" ").toLowerCase();
  return (!state.category || a.category === state.category) && (!state.kind || a.kind === state.kind)
    && (!state.theme || tile.theme === state.theme) && (!state.mood || a.moods.includes(state.mood) || a.moods.includes("any"))
    && (!state.aspect || tile.aspect === state.aspect) && (!state.script || a.scripts.includes(state.script))
    && state.text.split(/\s+/).every((w) => !w || hay.includes(w));
};

const media = (tile) => tile.poster
  ? `<img loading="lazy" src="${esc(tile.poster)}" alt="">` + (tile.preview ? `<video muted loop playsinline preload="none" src="${esc(tile.preview)}"></video>` : "")
  : `<div class="none">not rendered yet<br>hone-motif gallery --render-missing</div>`;

function draw() {
  const grid = document.getElementById("grid");
  const shown = DATA.tiles.filter(matches);
  count.textContent = `${shown.length} of ${DATA.tiles.length} looks · ${Object.keys(DATA.assets).length} assets`;
  grid.innerHTML = shown.map((t) => {
    const a = DATA.assets[t.asset];
    return `<div class="tile" data-i="${DATA.tiles.indexOf(t)}"><div class="media">${media(t)}</div><div class="meta">
      <div class="row"><span class="name">${esc(a.name)}</span><span class="kind" style="color:var(--${a.kind})">${a.kind}</span></div>
      <div class="sub">${esc(a.category)} / ${esc(a.subcategory)} · <span class="theme">${esc(t.theme)}${t.aspect === "16:9" ? "" : " · " + esc(t.aspect)}</span></div></div></div>`;
  }).join("");
  for (const el of grid.querySelectorAll(".tile")) {
    const v = el.querySelector("video");
    if (v) {
      el.onmouseenter = () => { v.style.display = "block"; v.play(); };
      el.onmouseleave = () => { v.pause(); v.currentTime = 0; v.style.display = "none"; };
    }
    el.onclick = () => open(Number(el.dataset.i));
  }
}

const rows = (obj) => Object.entries(obj).filter(([, v]) => v !== null && v !== undefined && !(Array.isArray(v) && !v.length))
  .map(([k, v]) => `<tr><th>${esc(k)}</th><td>${esc(typeof v === "object" ? JSON.stringify(v) : v)}</td></tr>`).join("");

function open(i) {
  const t = DATA.tiles[i];
  const a = DATA.assets[t.asset];
  const looks = DATA.tiles.map((x, k) => [x, k]).filter(([x]) => x.asset === a.id);
  const video = t.preview ? `<video controls autoplay loop muted src="${esc(t.preview)}"></video>` : (t.poster ? `<img style="width:100%" src="${esc(t.poster)}">` : "");
  const rules = {slots: a.slots, when: a.when, window: a.window, repeat: a.repeat, ends_with_video: a.ends_with_video, min_video_ms: a.min_video_ms,
    quiet_only: a.quiet_only, clear_frame: a.clear_frame, platforms: a.platforms, cut_ms: a.cut_ms, duration_ms: a.duration_ms, region: a.region};
  document.getElementById("body").innerHTML = `<button class="close" onclick="dlg.close()">×</button>
    <h2 style="margin:0 0 4px;font:600 22px Georgia,serif">${esc(a.name)} <span class="theme">${esc(t.theme)}</span></h2>
    <div class="sub">${esc(a.id)} · ${esc(a.category)} / ${esc(a.subcategory)} · ${a.kind} · ${a.aspects.join(", ")}</div>
    <p>${esc(a.line)}</p>
    <div class="themes">${looks.map(([x, k]) => `<button class="${k === i ? "on" : ""}" onclick="open(${k})">${esc(x.theme)}${x.aspect === "16:9" ? "" : " " + esc(x.aspect)}</button>`).join("")}</div>
    ${video}
    ${t.matte ? `<p class="sub">Matte layer (white = the incoming shot): <a style="color:var(--accent)" href="${esc(t.matte)}">${esc(t.matte.split("/").pop())}</a></p>` : ""}
    <div class="two"><div><h3>Placement</h3><table>${rows(rules)}</table>
      <h3>Text fields</h3><table>${a.text_fields.map((f) => `<tr><th>${esc(f.prop)}</th><td>≤ ${f.max_chars} chars · ${f.scripts.join(", ")} · ${esc(f.role)}</td></tr>`).join("") || "<tr><td>none</td></tr>"}</table>
      <h3>Licence</h3><table>${rows({licence: a.licence, fonts: a.fonts.join(", ") || "none", origin: a.origin, moods: a.moods.join(", "), tags: a.tags.join(", ")})}</table></div>
    <div><h3>Example props</h3><pre>${esc(JSON.stringify(a.props, null, 1))}</pre><h3>Props schema</h3><pre>${esc(JSON.stringify(a.props_schema, null, 1))}</pre></div></div>`;
  dlg.showModal();
}
const dlg = document.getElementById("dlg");
dlg.onclick = (e) => { if (e.target === dlg) dlg.close(); };
draw();
</script>
</body>
</html>
